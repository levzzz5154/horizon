ids = ["hook:debug_renderer_view", "type:DebugRendererViewEvent"]
why = "Native debug renderers can inspect the interpolated hitbox set and suppress the built-in hitbox draw for one view."
migrate = "Existing debug_renderer_draw listeners are unchanged. To replace F3+B, listen to debug_renderer_view, handle ENTITY_HITBOX_RENDERER, and call event.control.cancel_builtin()."
