ids = ["hook:entity_inside"]
why = "Changes BlockPart::entity_inside from server-only to both sides so the client can predict local-player block-contact movement (horizon#19791). Parts now also fire on the client for the local player alongside the server copy (`host.is_client_side()` is true there). On the client: `LevelRandomHost::random()` returns `None` and `set_random` returns `false`, so `with_random(...)` silently yields `None` without drawing; `AttachmentHost::attachments` returns `AttachmentError::MissingHolder`, so attachment reads fail; and writes outside `Push`, `SetMovement`, `StuckIn`, and `ResetFallDistance` as well as all queued `InsideEffect`s are dropped silently (so `Hurt` is not answered with `HurtSourceError` there, and `run_before`/`run_after` movement writes run without their dropped anchor effect)."
